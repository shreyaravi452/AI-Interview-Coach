services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-interview-coach-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      USE_DEMO_MODE: "true"
      PYTHONUNBUFFERED: "1"
      INTERVIEW_DB_PATH: /data/interviews.db
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: ai-interview-coach-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
